spring.application.name=insurance-management-system
server.port=8080
server.servlet.context-path=/api

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/insurance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-please-use-a-long-random-value}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
